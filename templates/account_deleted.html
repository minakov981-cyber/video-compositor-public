<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<title>Account deleted — ClipSnap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0a0a0b; --bg-card: #18181b; --border: #26262a; --text: #f5f3ef; --text-dim: #9a9aa2;
          --accent: #ff8e00; --display: 'Sora', sans-serif; --body: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); line-height: 1.6;
         min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
  .card { max-width: 440px; width: 100%; background: var(--bg-card); border: 1px solid var(--border);
          border-radius: 16px; padding: 32px 24px; text-align: center; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 1.3rem; color: var(--text); text-decoration: none; }
  .brand span { color: var(--accent); }
  h1 { font-family: var(--display); font-size: 1.4rem; margin: 22px 0 10px; }
  p { color: var(--text-dim); font-size: .92rem; }
  a.home { display: inline-block; margin-top: 22px; color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <a class="brand" href="/">Clip <span>Snap</span></a>
    <h1>Your account has been deleted</h1>
    <p>Your account, settings and stored files are gone, and any subscription has been cancelled. Thanks for trying ClipSnap.</p>
    <a class="home" href="/">Back to the homepage</a>
  </div>
</body>
</html>
