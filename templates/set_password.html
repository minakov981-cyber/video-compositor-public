<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Password — ClipSnap</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d0d0f;
    --surface: #16171c;
    --border:  #2a2b35;
    --accent:  #5b6af5;
    --accent-h:#7080ff;
    --text:    #e2e4f0;
    --muted:   #6b7280;
    --radius:  12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 36px;
    width: 100%;
    max-width: 420px;
  }

  .logo {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -.5px;
    margin-bottom: 6px;
  }

  .logo span { color: var(--accent); }

  .tagline {
    font-size: .85rem;
    color: var(--muted);
    margin-bottom: 32px;
  }

  h2 {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .sub {
    font-size: .85rem;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: .82rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: #0d0d0f;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: .95rem;
    outline: none;
    transition: border-color .2s;
  }

  .field input:focus { border-color: var(--accent); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    margin-top: 4px;
  }

  .btn:hover { background: var(--accent-h); }

  .alert {
    border-radius: 8px;
    padding: 12px 14px;
    font-size: .85rem;
    margin-bottom: 20px;
  }

  .alert-error {
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5;
  }
</style>
</head>
<body>

<div class="card">

  <div class="logo">Video <span>Compositor</span></div>
  <div class="tagline">Vertical reels, assembled instantly</div>

  <h2>Set your password</h2>
  <p class="sub">Create a password so you can sign in next time without a magic link.</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/set-password">
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" required autofocus minlength="8">
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" placeholder="Repeat password" required minlength="8">
    </div>
    <button type="submit" class="btn">Set password &amp; sign in</button>
  </form>

</div>

</body>
</html>
