<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<title>Set Password — ClipSnap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0b; --bg-elevated: #131315; --bg-card: #18181b; --border: #26262a; --border-soft: rgba(255,255,255,0.07);
    --text: #f5f3ef; --text-dim: #9a9aa2; --text-faint: #5c5c63;
    --accent: #ff8e00; --accent-soft: rgba(255,142,0,0.12); --accent-glow: rgba(255,142,0,0.35);
    --display: 'Sora', sans-serif; --mono: 'JetBrains Mono', monospace; --body: 'Inter', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    position: relative;
  }

  /* Same dotted backdrop as the landing page */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 30%, transparent 100%);
  }

  .brand {
    display: flex; align-items: center; gap: 10px; margin-bottom: 22px;
    font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--text); text-decoration: none;
    position: relative;
  }
  .brand img { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 0 22px var(--accent-glow); }

  .card {
    position: relative;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }

  .tagline {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    display: inline-flex; align-items: center; gap: 8px;
    margin-bottom: 14px;
  }
  .tagline::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent-glow);
  }

  h2 {
    font-family: var(--display);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 8px;
  }

  .sub {
    font-size: 14.5px;
    color: var(--text-dim);
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .sub strong { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
  h2 + form, h2 + .alert { margin-top: 22px; }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    margin-bottom: 7px;
  }

  .field input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: var(--body);
    font-size: 15px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input::placeholder { color: var(--text-faint); }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #0a0a0b;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-family: var(--body);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    margin-top: 6px;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 28px var(--accent-glow); }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .alert {
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .alert-error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
  .alert-success { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); color: #86efac; }

  .footer-link {
    margin-top: 22px;
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
  }
  .footer-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .footer-link a:hover { text-decoration: underline; }
  .footer-link + .footer-link { margin-top: 10px; }

  .sent-icon {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--accent-soft); border: 1px solid rgba(255,142,0,.4); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }

  /* Honeypot: invisible to people, bots fill it in */
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .cf-turnstile { margin-bottom: 16px; min-height: 65px; }
  .consent { font-size: 12.5px; color: var(--text-faint); text-align: center; margin-top: 14px; line-height: 1.55; }
  .consent a { color: var(--text-dim); }
  .legal-links { position: relative; margin-top: 26px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; font-size: 13px; }
  .legal-links a { color: var(--text-faint); text-decoration: none; }
  .legal-links a:hover { color: var(--text-dim); }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; border-radius: 16px; }
    h2 { font-size: 23px; }
  }
</style>
</head>
<body>

<a class="brand" href="/"><img src="/static/icon-192.png" alt="">ClipSnap</a>

<div class="card">

  <div class="tagline">Almost there</div>
  <h2>Set your password</h2>
  <p class="sub">Create a password so you can sign in next time without a magic link.</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/set-password">
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" required autofocus minlength="8" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" placeholder="Repeat password" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit" class="btn">Set password &amp; sign in</button>
  </form>

</div>

<nav class="legal-links">
  <a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/refunds">Refunds</a><a href="mailto:{{ legal.email }}">Contact</a>
</nav>

</body>
</html>
